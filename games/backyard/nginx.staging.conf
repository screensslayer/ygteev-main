server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Vite fingerprints these, so the name changes whenever the bytes do.
  # Safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # index.html is NOT fingerprinted, and it is the file that decides which
  # bundle the page loads. Stock nginx sends no Cache-Control at all, which
  # leaves iOS Safari free to apply heuristic caching — so a fix could be
  # live on the server and still invisible on the phone, with no way to tell
  # the two apart from the outside. Always revalidate.
  location = /index.html {
    add_header Cache-Control "no-cache, must-revalidate";
  }

  # Unhashed art and audio under /ui and /voices. A day is short enough that
  # a replaced asset turns up on its own, long enough to keep the game from
  # refetching megabytes on every load. Anything needing to change faster
  # carries its own ?v= (see VOICE_V in the game).
  location ~* \.(png|jpg|jpeg|gif|svg|mp3|glb|woff2?)$ {
    add_header Cache-Control "public, max-age=86400";
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
