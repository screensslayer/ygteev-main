<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Ember Lab — dragon design test</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; font-family: "Trebuchet MS", "Segoe UI", sans-serif; }
  body { background: radial-gradient(120% 90% at 50% 20%, #453061 0%, #2a1c44 55%, #16102a 100%); }
  #app { position: fixed; inset: 0; }
  .hud { position: fixed; left: 0; right: 0; display: flex; justify-content: center; gap: 8px; flex-wrap: wrap;
         bottom: calc(18px + env(safe-area-inset-bottom, 0px)); z-index: 5; padding: 0 10px; }
  .hud button {
    font-family: inherit; font-weight: 800; font-size: 13px; letter-spacing: .3px;
    padding: 10px 14px; border-radius: 999px; border: 1px solid rgba(255,255,255,.22); cursor: pointer;
    background: rgba(16, 10, 32, .6); color: #efe6ff; backdrop-filter: blur(6px);
    transition: transform .12s, background .12s;
  }
  .hud button:hover { transform: translateY(-2px); }
  .hud button.on { background: #e8433f; color: #ffe9e4; border-color: #ff8a80; }
  .tag { position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: 16px; z-index: 5;
         color: #efe6ff; opacity: .85; user-select: none; }
  .tag b { font-size: 15px; letter-spacing: 1px; }
  .tag div { font-size: 11px; opacity: .75; margin-top: 2px; }
</style>
</head>
<body>
<div id="app"></div>
<div class="tag"><b>🐉 EMBER LAB</b><div>design test v3 — drag to orbit · pinch/scroll to zoom</div></div>
<div class="hud" id="hud"></div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
/* =====================================================================
   EMBER LAB v3 — sculpted low-poly dragon
   Design rules this pass:
   • ONE lathed silhouette for the torso (no stacked-primitive seams)
   • limbs grow out of joints (shoulder/haunch balls buried in the body)
   • wings are boned: root socket → humerus → fingers, with a scalloped
     membrane stretched between the bones as real geometry
   • palette: purple hide / red belly+membrane / black horns+claws+spikes
   • both eyes white, mismatched sizes (the googly stays)
   ===================================================================== */

const COL = {
  hide:    0x332a42,   // near-black body (a whisper of purple so facets shade)
  hideD:   0x272033,   // limbs, jaw, shading masses
  hideXD:  0x1c1628,   // feet/paws
  red:     0xb5303c,   // belly plates
  redB:    0xd0424b,   // membrane, tongue
  accent:  0x9b59c9,   // PURPLE horns, brows, claws, spikes
  cream:   0xf2ead2,   // teeth
  mouth:   0x4a1420,
  white:   0xf6f4f0,
  pupil:   0x17101d,
};

const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, roughness: .8, metalness: 0, flatShading: true }, o));

// ---------- scene ----------
const app = document.getElementById("app");
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(2, window.devicePixelRatio));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, .1, 100);
camera.position.set(3.2, 2.4, 5.4);

const controls = new THREE.OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.6, 0);
controls.enableDamping = true;
controls.dampingFactor = .08;
controls.minDistance = 2.5; controls.maxDistance = 12;
controls.maxPolarAngle = Math.PI * .55;

scene.add(new THREE.HemisphereLight(0xbfa8e8, 0x241a3a, 1.05));
const key = new THREE.DirectionalLight(0xfff0da, 1.2);
key.position.set(4, 7, 5);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.camera.left = -5; key.shadow.camera.right = 5;
key.shadow.camera.top = 6;  key.shadow.camera.bottom = -2;
scene.add(key);
const rim = new THREE.DirectionalLight(0xff6a5d, .85);   // hot red rim from behind
rim.position.set(-4, 3, -5);
scene.add(rim);

const ground = new THREE.Mesh(new THREE.CircleGeometry(7, 36), M(0x3b2b5c, { roughness: 1 }));
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);
const groundRim = new THREE.Mesh(new THREE.RingGeometry(7, 7.5, 36), M(0x2a1e45, { roughness: 1 }));
groundRim.rotation.x = -Math.PI / 2;
groundRim.position.y = .001;
scene.add(groundRim);

// ---------- helpers ----------
const P = {};
const BASE = {};
function reg(name, obj) {
  P[name] = obj;
  BASE[name] = { p: obj.position.clone(), r: obj.rotation.clone(), s: obj.scale.clone() };
}
const sph = (r, w = 9, h = 7) => new THREE.SphereGeometry(r, w, h);
const mesh = (geo, mat, cast = true) => {
  const m = new THREE.Mesh(geo, mat);
  m.castShadow = cast;
  return m;
};
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);

// tapered bone between two points — the connective tissue this design needed
function bone(a, b, r0, r1, mat, radial = 6) {
  const dir = new THREE.Vector3().subVectors(b, a);
  const len = dir.length();
  const m = mesh(new THREE.CylinderGeometry(r1, r0, len, radial), mat);
  m.position.copy(a).addScaledVector(dir, .5);
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), dir.clone().normalize());
  return m;
}

// ---------- the dragon ----------
const dragon = new THREE.Group();
scene.add(dragon);

// -- torso: ONE lathed silhouette (chest forward, belly swell, tucked rump) --
const PROFILE = [           // [y, radius] — piecewise silhouette
  [.14, .06], [.16, .52], [.32, .84], [.72, 1.02], [1.08, 1.07],
  [1.46, .99], [1.8, .8], [2.06, .56], [2.2, .36], [2.3, .05],
];
function bodyR(y) {
  for (let i = 0; i < PROFILE.length - 1; i++) {
    const [y0, r0] = PROFILE[i], [y1, r1] = PROFILE[i + 1];
    if (y >= y0 && y <= y1) return r0 + (r1 - r0) * ((y - y0) / (y1 - y0));
  }
  return .5;
}
const torso = new THREE.Group();
dragon.add(torso);
reg("torso", torso);

const bodyPts = PROFILE.map(([y, r]) => new THREE.Vector2(r, y));
const body = mesh(new THREE.LatheGeometry(bodyPts, 9), M(COL.hide));
torso.add(body);

// -- segmented red belly plates on the front only (lathe wedges) --
const PLATE_ARC = 1.42;                      // ~81° across the front — ends before the arms
for (const [y0, y1] of [[.3, .62], [.66, 1.02], [1.06, 1.42], [1.46, 1.74]]) {
  const pts = [];
  const n = 4;
  for (let i = 0; i <= n; i++) {
    const y = y0 + (y1 - y0) * i / n;
    const bulge = 1.02 + .05 * Math.sin(Math.PI * i / n);   // each plate is a soft pillow
    pts.push(new THREE.Vector2(bodyR(y) * bulge, y));
  }
  const plate = mesh(new THREE.LatheGeometry(pts, 5, -PLATE_ARC / 2, PLATE_ARC), M(COL.red, { roughness: .7 }));
  torso.add(plate);
}

// dorsal spike line — black, shrinking down the spine
[[1.98, -.48, .30], [1.7, -.72, .26], [1.4, -.88, .22], [1.05, -.95, .19]].forEach(([y, z, s]) => {
  const sp = mesh(new THREE.ConeGeometry(s * .55, s * 1.9, 4), M(COL.accent));
  sp.position.set(0, y, z);
  sp.rotation.x = -.85;
  torso.add(sp);
});

// two understated hide spots (dark purple) — texture without clutter
[[-.78, 1.3, .38, .15], [.74, .82, -.5, .13]].forEach(([x, y, z, r]) => {
  const h = mesh(new THREE.CylinderGeometry(r, r, .03, 6), M(COL.hideD), false);
  h.position.set(x, y, z);
  h.lookAt(x * 3, y + .3, z * 3);
  h.rotateX(Math.PI / 2);
  torso.add(h);
});

// -- neck: connective mass so the head doesn't sit on the shoulders --
const neck = bone(V3(0, 2.05, .1), V3(0, 2.5, .26), .42, .3, M(COL.hide), 8);
torso.add(neck);

// -- head --
const headG = new THREE.Group();
headG.position.set(0, 2.66, .3);
dragon.add(headG);
reg("head", headG);

const cranium = mesh(sph(.82, 10, 8), M(COL.hide));
cranium.scale.set(1.04, .92, 1.0);
cranium.position.y = .3;
headG.add(cranium);
// cheek masses blend the skull into the muzzle
const cheekL = mesh(sph(.34, 8, 6), M(COL.hide));
cheekL.position.set(-.48, .02, .42);
const cheekR = cheekL.clone(); cheekR.position.x = .48;
headG.add(cheekL, cheekR);
// muzzle
const snout = mesh(sph(.6, 8, 6), M(COL.hide));
snout.scale.set(1.06, .5, 1.42);
snout.position.set(0, .04, .64);
headG.add(snout);
// nostril flares
const noseL = mesh(sph(.11, 6, 5), M(COL.hideD));
noseL.position.set(-.22, .26, 1.34);
const noseR = noseL.clone(); noseR.position.x = .22;
headG.add(noseL, noseR);

// upper snaggle teeth
const upperTeeth = [[-.5, .5, .17], [-.28, .8, .22], [.04, .58, .15], [.3, .86, .23], [.5, .46, .15]];
for (const [x, z, s] of upperTeeth) {
  const t = mesh(new THREE.ConeGeometry(s * .6, s * 1.7, 5), M(COL.cream, { roughness: .5 }));
  t.rotation.x = Math.PI;
  t.rotation.z = (x < 0 ? -1 : 1) * .18;
  t.position.set(x, -.18, .6 + z * .55);
  headG.add(t);
}
// mouth interior
const throat = mesh(new THREE.BoxGeometry(.86, .34, 1.0), M(COL.mouth, { roughness: 1 }), false);
throat.position.set(0, -.28, .52);
headG.add(throat);

// -- jaw --
const jaw = new THREE.Group();
jaw.position.set(0, -.26, .08);
headG.add(jaw);
reg("jaw", jaw);
const jawMesh = mesh(sph(.54, 8, 6), M(COL.hideD));
jawMesh.scale.set(.96, .42, 1.4);
jawMesh.position.set(0, -.08, .52);
jaw.add(jawMesh);
const chin = mesh(sph(.28, 7, 5), M(COL.hideXD));
chin.scale.set(1, .55, .8);
chin.position.set(0, -.13, 1.02);
jaw.add(chin);
const lowerTeeth = [[-.4, .9, .18], [-.12, .58, .13], [.2, .95, .21], [.44, .6, .13]];
for (const [x, z, s] of lowerTeeth) {
  const t = mesh(new THREE.ConeGeometry(s * .58, s * 1.6, 5), M(COL.cream, { roughness: .5 }));
  t.rotation.z = (x < 0 ? 1 : -1) * .2;
  t.position.set(x, .05, .34 + z * .6);
  jaw.add(t);
}

// -- tongue (red) --
const tongueRoot = new THREE.Group();
tongueRoot.position.set(.08, .02, .78);
jaw.add(tongueRoot);
reg("tongue", tongueRoot);
const tSegs = [];
let tParent = tongueRoot;
for (let i = 0; i < 3; i++) {
  const g = new THREE.Group();
  g.position.z = i === 0 ? 0 : .34;
  const slab = mesh(new THREE.BoxGeometry(.32 - i * .06, .075, .4), M(COL.redB, { roughness: .55 }));
  slab.position.z = .18;
  g.add(slab);
  tParent.add(g);
  tParent = g;
  tSegs.push(g);
}
const tongueTip = mesh(new THREE.ConeGeometry(.11, .2, 4), M(COL.redB, { roughness: .55 }));
tongueTip.rotation.x = Math.PI / 2;
tongueTip.position.z = .44;
tParent.add(tongueTip);

// -- eyes: BOTH white, mismatched sizes --
function makeEye(x, r, pupilR) {
  const g = new THREE.Group();
  g.position.set(x, .5, .74);
  headG.add(g);
  const ball = mesh(sph(r, 10, 8), M(COL.white, { roughness: .3 }));
  g.add(ball);
  const pupil = mesh(sph(pupilR, 8, 6), M(COL.pupil, { roughness: .2 }));
  pupil.position.z = r * .78;
  g.add(pupil);
  const glint = mesh(sph(pupilR * .26, 6, 5), M(0xffffff, { roughness: .1, emissive: 0xffffff, emissiveIntensity: .4 }), false);
  glint.position.set(pupilR * .4, pupilR * .45, r * .94);
  g.add(glint);
  const lid = mesh(new THREE.SphereGeometry(r * 1.12, 10, 6, 0, Math.PI * 2, 0, Math.PI * .55), M(COL.hideD));
  lid.rotation.x = -1.45;
  g.add(lid);
  return { g, ball, pupil, glint, lid, r };
}
const eyeL = makeEye(-.42, .33, .13);
const eyeR = makeEye(.4, .25, .14);
eyeL.g.rotation.y = -.12;
eyeR.g.rotation.y = .1;
reg("eyeL", eyeL.g); reg("eyeR", eyeR.g);

// heavy black brow ridges seated ON the orbitals
const browL = mesh(new THREE.BoxGeometry(.46, .14, .26), M(COL.accent));
browL.position.set(-.43, .9, .86);
browL.rotation.set(-.5, 0, -.12);
const browR = browL.clone();
browR.position.x = .41; browR.rotation.z = .12;
headG.add(browL, browR);
reg("browL", browL); reg("browR", browR);

// swept-back black horns (two-bone curve + tip)
for (const side of [-1, 1]) {
  const a = V3(.42 * side, .78, -.05), b = V3(.72 * side, 1.1, -.5), c = V3(.86 * side, 1.22, -.85);
  headG.add(bone(a, b, .12, .07, M(COL.accent), 5));
  headG.add(bone(b, c, .07, .015, M(COL.accent), 5));
}
// small head crest spikes between the horns
[[0, .98, -.3, .5], [0, .8, -.62, .38]].forEach(([x, y, z, s]) => {
  const cSpike = mesh(new THREE.ConeGeometry(.13 * s + .05, .5 * s + .1, 4), M(COL.accent));
  cSpike.position.set(x, y, z);
  cSpike.rotation.x = -.7;
  headG.add(cSpike);
});

// -- wings: boned, with a membrane stretched between the bones --
function makeWing(side) {
  const g = new THREE.Group();
  g.position.set(.34 * side, 1.98, -.42);       // root buried in the back muscle
  dragon.add(g);
  const s = (v) => V3(v.x * side, v.y, v.z);

  const socket = mesh(sph(.2, 7, 5), M(COL.hide));
  g.add(socket);

  const elbow = s(V3(.5, .42, -.12));
  const f1 = s(V3(1.35, .78, -.3));             // long leading finger
  const f2 = s(V3(1.42, .22, -.28));
  const f3 = s(V3(1.05, -.28, -.2));
  const inner = s(V3(.18, -.5, -.05));          // membrane trailing edge at the body

  g.add(bone(V3(0, 0, 0), elbow, .09, .07, M(COL.hideD), 5));
  g.add(bone(elbow, f1, .06, .02, M(COL.hideD), 5));
  g.add(bone(elbow, f2, .05, .02, M(COL.hideD), 5));
  g.add(bone(elbow, f3, .05, .02, M(COL.hideD), 5));
  const elbowBall = mesh(sph(.09, 6, 5), M(COL.hideD));
  elbowBall.position.copy(elbow);
  g.add(elbowBall);
  const thumb = mesh(new THREE.ConeGeometry(.045, .16, 4), M(COL.accent));
  thumb.position.copy(elbow).add(s(V3(.08, .12, 0)));
  g.add(thumb);

  // membrane: fan of triangles root→rim with scallops pulled in between fingers
  const lerpIn = (a, b, k, pull) => a.clone().lerp(b, k).multiplyScalar(1 - pull);
  const rimPts = [
    elbow, f1,
    lerpIn(f1, f2, .5, .16), f2,
    lerpIn(f2, f3, .5, .14), f3,
    lerpIn(f3, inner, .5, .1), inner,
  ];
  const verts = [];
  for (let i = 0; i < rimPts.length - 1; i++) {
    verts.push(0, 0, 0,
      rimPts[i].x, rimPts[i].y, rimPts[i].z,
      rimPts[i + 1].x, rimPts[i + 1].y, rimPts[i + 1].z);
  }
  const memGeo = new THREE.BufferGeometry();
  memGeo.setAttribute("position", new THREE.Float32BufferAttribute(verts, 3));
  memGeo.computeVertexNormals();
  const mem = mesh(memGeo, M(COL.redB, { side: THREE.DoubleSide, roughness: .65 }));
  g.add(mem);
  return g;
}
reg("wingL", makeWing(-1));
reg("wingR", makeWing(1));

// -- arms: shoulder ball → tapered bone → paw with black claws --
function makeArm(side) {
  const g = new THREE.Group();
  g.position.set(.6 * side, 1.76, .3);          // group origin AT the shoulder
  dragon.add(g);
  const shoulder = mesh(sph(.22, 8, 6), M(COL.hide));
  g.add(shoulder);
  const elbow = V3(.24 * side, -.36, .28);
  const wrist = V3(.3 * side, -.56, .46);
  g.add(bone(V3(0, 0, 0), elbow, .15, .11, M(COL.hideD), 6));
  g.add(bone(elbow, wrist, .11, .09, M(COL.hideD), 6));
  const paw = mesh(sph(.15, 7, 5), M(COL.hideXD));
  paw.position.copy(wrist);
  g.add(paw);
  for (let i = -1; i <= 1; i++) {
    const claw = mesh(new THREE.ConeGeometry(.045, .15, 4), M(COL.accent, { roughness: .45 }));
    claw.rotation.x = Math.PI / 2;
    claw.position.set(wrist.x + i * .08, wrist.y - .03, wrist.z + .16);
    g.add(claw);
  }
  return g;
}
reg("armL", makeArm(-1));
reg("armR", makeArm(1));

// -- legs: haunch buried in the body → thick foot with black claws --
function makeLeg(side) {
  const g = new THREE.Group();
  g.position.set(.52 * side, .66, .04);         // origin at the hip
  dragon.add(g);
  const haunch = mesh(sph(.4, 8, 6), M(COL.hideD));
  haunch.scale.set(.92, 1.0, 1.05);
  haunch.position.set(.04 * side, -.14, 0);
  g.add(haunch);
  const foot = mesh(sph(.29, 8, 5), M(COL.hideXD));
  foot.scale.set(1.08, .48, 1.4);
  foot.position.set(.08 * side, -.53, .18);
  g.add(foot);
  for (let i = -1; i <= 1; i++) {
    const claw = mesh(new THREE.ConeGeometry(.07, .2, 4), M(COL.accent, { roughness: .45 }));
    claw.rotation.x = Math.PI / 2;
    claw.position.set(.08 * side + i * .15, -.56, .52);
    g.add(claw);
  }
  return g;
}
reg("legL", makeLeg(-1));
reg("legR", makeLeg(1));

// -- tail: thick root merging into the rump, black spikes, red tip fin --
const tail0 = new THREE.Group();
tail0.position.set(0, .6, -.78);
dragon.add(tail0);
const t0m = mesh(sph(.36, 8, 6), M(COL.hide));
t0m.scale.set(1, .9, 1.3); t0m.position.z = -.2;
tail0.add(t0m);
const tail1 = new THREE.Group();
tail1.position.set(0, .05, -.52);
tail0.add(tail1);
const t1m = mesh(sph(.25, 7, 5), M(COL.hideD));
t1m.scale.set(1, .9, 1.35); t1m.position.z = -.18;
tail1.add(t1m);
const tail2 = new THREE.Group();
tail2.position.set(0, .05, -.46);
tail1.add(tail2);
const t2m = mesh(sph(.16, 7, 5), M(COL.hide));
t2m.scale.set(1, .9, 1.45); t2m.position.z = -.15;
tail2.add(t2m);
[[tail0, .17, -.28], [tail1, .14, -.22], [tail2, .11, -.18]].forEach(([seg, s, z]) => {
  const spike = mesh(new THREE.ConeGeometry(s * .7, s * 2.2, 4), M(COL.accent));
  spike.position.set(0, .2, z);
  spike.rotation.x = -.55;
  seg.add(spike);
});
// red tail fin
const finShape = new THREE.Shape();
finShape.moveTo(0, 0); finShape.lineTo(.02, .3); finShape.lineTo(.34, .18);
finShape.lineTo(.2, 0); finShape.lineTo(.34, -.18); finShape.lineTo(.02, -.3); finShape.lineTo(0, 0);
const fin = mesh(new THREE.ShapeGeometry(finShape), M(COL.redB, { side: THREE.DoubleSide, roughness: .65 }));
fin.rotation.y = Math.PI / 2;
fin.rotation.z = Math.PI / 2;
fin.position.set(0, .05, -.5);
tail2.add(fin);
reg("tail0", tail0); reg("tail1", tail1); reg("tail2", tail2);

reg("root", dragon);

// resting asymmetry — a designed character never stands perfectly mirrored
P.head.rotation.z = .05;
P.armR.rotation.x = -.18;
BASE.head.r.z = .05;
BASE.armR.r.x = -.18;

// ---------- particles ----------
const pool = [];
function makeZTexture() {
  const cv = document.createElement("canvas");
  cv.width = cv.height = 64;
  const c = cv.getContext("2d");
  c.font = "bold 44px Trebuchet MS";
  c.textAlign = "center"; c.textBaseline = "middle";
  c.fillStyle = "#dcd0ff";
  c.fillText("z", 32, 34);
  return new THREE.CanvasTexture(cv);
}
const zTex = makeZTexture();
function spawn(kind, x, y, z) {
  let p = pool.find((q) => !q.live);
  if (!p) {
    if (pool.length > 40) return;
    p = { mesh: null, live: false };
    pool.push(p);
  }
  if (p.mesh) { scene.remove(p.mesh); p.mesh = null; }
  if (kind === "zzz") {
    const sp = new THREE.Sprite(new THREE.SpriteMaterial({ map: zTex, transparent: true, depthWrite: false }));
    sp.scale.set(.4, .4, 1);
    p.mesh = sp;
  } else {
    const col = kind === "ember" ? 0xff5230 : 0x8f7bb0;
    p.mesh = new THREE.Mesh(new THREE.TetrahedronGeometry(kind === "ember" ? .07 : .1),
      new THREE.MeshBasicMaterial({ color: col, transparent: true }));
  }
  p.kind = kind; p.live = true; p.age = 0;
  p.vx = (Math.random() - .5) * (kind === "dust" ? 1.2 : .3);
  p.vy = kind === "dust" ? .5 + Math.random() * .5 : .8 + Math.random() * .6;
  p.vz = (Math.random() - .5) * (kind === "dust" ? .8 : .3);
  p.mesh.position.set(x, y, z);
  scene.add(p.mesh);
}
function updateParticles(dt) {
  for (const p of pool) {
    if (!p.live) continue;
    p.age += dt;
    const ttl = p.kind === "zzz" ? 1.8 : .8;
    if (p.age > ttl) { p.live = false; scene.remove(p.mesh); continue; }
    p.mesh.position.x += p.vx * dt;
    p.mesh.position.y += p.vy * dt;
    p.mesh.position.z += p.vz * dt;
    if (p.mesh.material) p.mesh.material.opacity = 1 - p.age / ttl;
    if (p.kind !== "zzz") p.mesh.rotation.x += dt * 6;
  }
}

// ---------- animation engine ----------
const osc = (t, f, a, ph = 0) => Math.sin(t * f * Math.PI * 2 + ph) * a;

const ctl = {
  blink: 0, winkR: 0, tongue: 0, jaw: 0, rage: 0,
  nextBlink: 1.5, nextTongue: 5, nextFlap: 4, flapT: 99, snoreT: 0,
};

const states = {
  standing(t) {
    // happy wiggle folded into idle — the fed-rock from the game,
    // firing as a recurring flourish every ~9s
    const w = t % 9;
    const wigEnv = w < 1.2 ? Math.sin(w / 1.2 * Math.PI) : 0;
    return {
      root:  { r: [0, 0, osc(t, 2, .09) * wigEnv] },
      torso: { s: [1, 1 + osc(t, .28, .018), 1] },
      head:  { r: [osc(t, .2, .05, 1), osc(t, .13, .16), osc(t, .17, .03) + osc(t, 2, .05) * wigEnv] },
      tail0: { r: [0, osc(t, .3, .3) + osc(t, 2.4, .3) * wigEnv, 0] },
      tail1: { r: [0, osc(t, .3, .35, .8), 0] },
      tail2: { r: [0, osc(t, .3, .4, 1.6), 0] },
      armL:  { r: [osc(t, .28, .07), 0, .06] },
      armR:  { r: [osc(t, .28, .07, 2), 0, -.06] },
    };
  },
  waking(t) {
    // the game's wake-up stretch, promoted to a full state: rear back,
    // big yawn with a tongue curl, wings unfurl, settle, repeat
    const p = (t % 3.6) / 3.6;
    const env = p < .62 ? Math.sin(p / .62 * Math.PI) : 0;
    const shake = p > .66 && p < .82 ? Math.sin((p - .66) * 60) * (1 - (p - .66) / .16) : 0;
    return {
      root:  { p: [0, env * .14, 0] },
      torso: { s: [1 - env * .04, 1 + env * .1, 1 - env * .04] },
      head:  { p: [0, env * .1, -env * .08], r: [-env * .55 + shake * .06, shake * .12, 0] },
      jawX:  env * .9,
      tongueX: env * .55,
      blinkX: env * .85,
      wingL: { r: [-env * .4, 0, env * .95] },
      wingR: { r: [-env * .4, 0, -env * .95] },
      armL:  { r: [-env * .7, 0, env * .4] },
      armR:  { r: [-env * .7, 0, -env * .4] },
      tail0: { r: [env * .3, osc(t, .4, .15), 0] },
    };
  },
  sleeping(t) {
    const breathe = osc(t, .16, .05);
    return {
      root:  { p: [0, -.12, 0], r: [.1, 0, 0] },
      torso: { s: [1 + breathe * .4, .9 + breathe, 1 + breathe * .4] },
      head:  { p: [0, -.26, .1], r: [.42, .12, .06] },
      jawX:  .16,
      tongueX: .35,
      blinkX: 1,
      wingL: { r: [.3, -.35, .25] }, wingR: { r: [.3, .35, -.25] },
      armL:  { r: [.4, 0, .2] }, armR: { r: [.4, 0, -.2] },
      tail0: { r: [0, osc(t, .1, .1), 0] },
    };
  },
  running(t) {
    const f = 2.6;
    const bob = Math.abs(Math.sin(t * f * Math.PI * 2)) * .1;
    return {
      root:  { p: [0, bob, 0], r: [-.22, 0, osc(t, f, .04)] },
      legL:  { r: [osc(t, f, .95), 0, 0] },
      legR:  { r: [osc(t, f, .95, Math.PI), 0, 0] },
      armL:  { r: [osc(t, f, .8, Math.PI), 0, .12] },
      armR:  { r: [osc(t, f, .8), 0, -.12] },
      head:  { r: [.15 + osc(t, f, .06), 0, osc(t, f * .5, .07)] },
      wingL: { r: [.3 + osc(t, f, .3), 0, .25 + osc(t, f, .3)] },
      wingR: { r: [.3 + osc(t, f, .3), 0, -.25 - osc(t, f, .3)] },
      tail0: { r: [.25, osc(t, f * .5, .25), 0] },
      tail1: { r: [0, osc(t, f * .5, .35, 1), 0] },
      jawX:  .45,
      tongueX: 1,
    };
  },
  angry(t) {
    const stomp = Math.max(0, Math.sin(t * 1.6 * Math.PI * 2));
    const roar = (Math.sin(t * .55 * Math.PI * 2) + 1) / 2;
    return {
      root:  { p: [0, -.06 + stomp * .05, 0], r: [.1, osc(t, 6, .012), 0] },
      torso: { s: [1.05, .96, 1.05] },
      head:  { p: [0, -.08, .08], r: [-.15 + roar * .32, osc(t, 5.5, .02), 0] },
      jawX:  .25 + roar * .75,
      rageX: 1,
      blinkX: .25,
      wingL: { r: [-.3, .25, .55 + osc(t, 2.6, .3)] },
      wingR: { r: [-.3, -.25, -.55 - osc(t, 2.6, .3)] },
      armL:  { r: [-.5, 0, .3] }, armR: { r: [-.5, 0, -.3] },
      legL:  { r: [stomp * .3, 0, 0] },
      legR:  { r: [Math.max(0, Math.sin((t + .31) * 1.6 * Math.PI * 2)) * .3, 0, 0] },
      tail0: { r: [0, osc(t, 1.4, .5), 0] },
      tail1: { r: [0, osc(t, 1.4, .6, 1), 0] },
      tail2: { r: [0, osc(t, 1.4, .7, 2), 0] },
    };
  },
  crazy(t) {
    const spin = (t % 5) < 1.1 ? (t % 5) / 1.1 : 0;
    const hop = Math.abs(Math.sin(t * 3.4 * Math.PI)) * .16;
    return {
      root:  { p: [0, hop, 0], r: [0, spin * Math.PI * 2, osc(t, 1.2, .1)] },
      head:  { r: [osc(t, 1.8, .2), osc(t, 2.3, .4), osc(t, 2.9, .22)] },
      jawX:  .4 + osc(t, 2.2, .3),
      tongueX: 1,
      winkX: (Math.sin(t * 1.1) > .4) ? 1 : 0,
      wingL: { r: [0, 0, .3 + osc(t, 4.2, .5)] },
      wingR: { r: [0, 0, -.3 - osc(t, 3.1, .5, 1)] },
      armL:  { r: [osc(t, 3, .7), 0, .3] },
      armR:  { r: [osc(t, 3.6, .7, 1), 0, -.3] },
      legL:  { r: [osc(t, 3.4, .5), 0, 0] },
      legR:  { r: [osc(t, 3.4, .5, Math.PI), 0, 0] },
      tail0: { r: [0, osc(t, 2.4, .6), 0] },
      tail1: { r: [0, osc(t, 2.4, .8, 1.2), 0] },
    };
  },
  rampage(t) {
    // the in-game hangry charge: running's stride + crazy's unhinged
    // head, hot eyes, and full-speed flapping
    const f = 3.2;
    const bob = Math.abs(Math.sin(t * f * Math.PI * 2)) * .14;
    return {
      root:  { p: [0, bob, 0], r: [-.3, 0, osc(t, f, .06)] },
      legL:  { r: [osc(t, f, 1.05), 0, 0] },
      legR:  { r: [osc(t, f, 1.05, Math.PI), 0, 0] },
      armL:  { r: [osc(t, f, .9, Math.PI), 0, .18] },
      armR:  { r: [osc(t, f, .9), 0, -.18] },
      head:  { r: [.2 + osc(t, 2.1, .16), osc(t, 2.7, .3), osc(t, 3.3, .16)] },
      jawX:  .55 + osc(t, 2.4, .35),
      tongueX: 1,
      rageX: .8,
      winkX: (Math.sin(t * 1.3) > .5) ? 1 : 0,
      wingL: { r: [.2 + osc(t, 5, .55), 0, .4 + osc(t, 5, .35)] },
      wingR: { r: [.2 + osc(t, 5, .55), 0, -.4 - osc(t, 5, .35)] },
      tail0: { r: [.3, osc(t, f * .5, .35), 0] },
      tail1: { r: [0, osc(t, f * .5, .5, 1), 0] },
      tail2: { r: [0, osc(t, f * .5, .6, 2), 0] },
    };
  },
  eating(t) {
    const chomp = (Math.sin(t * 2.2 * Math.PI * 2) + 1) / 2;
    const gulp = Math.max(0, Math.sin(t * .7 * Math.PI * 2));
    return {
      head:  { p: [0, -.12 + gulp * .06, .12], r: [.3 - chomp * .12, osc(t, .5, .07), 0] },
      jawX:  .15 + chomp * .5,
      blinkX: .45,
      torso: { s: [1 + gulp * .05, 1, 1 + gulp * .05] },
      armL:  { r: [-.9, 0, .2] }, armR: { r: [-.9, 0, -.2] },
      tail0: { r: [0, osc(t, .8, .35), 0] },
      tail1: { r: [0, osc(t, .8, .45, .9), 0] },
    };
  },
};

let stateName = "standing";
let prevPose = null, blend = 1, stateT = 0;
let currentPose = {};

function setState(name) {
  if (name === stateName) return;
  prevPose = currentPose;
  blend = 0;
  stateName = name;
  stateT = 0;
  document.querySelectorAll(".hud button").forEach((b) => b.classList.toggle("on", b.dataset.s === name));
}

function applyPose(pose) {
  for (const name in P) {
    const b = BASE[name], o = pose[name];
    const obj = P[name];
    obj.position.set(b.p.x + (o?.p?.[0] || 0), b.p.y + (o?.p?.[1] || 0), b.p.z + (o?.p?.[2] || 0));
    obj.rotation.set(b.r.x + (o?.r?.[0] || 0), b.r.y + (o?.r?.[1] || 0), b.r.z + (o?.r?.[2] || 0));
    obj.scale.set(b.s.x * (o?.s?.[0] || 1), b.s.y * (o?.s?.[1] || 1), b.s.z * (o?.s?.[2] || 1));
  }
}
function mixPose(a, b, k) {
  const out = {};
  const names = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const n of names) {
    if (n.endsWith("X")) { out[n] = (a?.[n] || 0) * (1 - k) + (b?.[n] || 0) * k; continue; }
    const pa = a?.[n] || {}, pb = b?.[n] || {};
    out[n] = {
      p: [0, 1, 2].map((i) => (pa.p?.[i] || 0) * (1 - k) + (pb.p?.[i] || 0) * k),
      r: [0, 1, 2].map((i) => (pa.r?.[i] || 0) * (1 - k) + (pb.r?.[i] || 0) * k),
      s: [0, 1, 2].map((i) => (pa.s?.[i] ?? 1) * (1 - k) + (pb.s?.[i] ?? 1) * k),
    };
  }
  return out;
}

// ---------- micro-behaviors ----------
function microUpdate(dt, t, pose) {
  const want = {
    blink: pose.blinkX ?? 0,
    tongue: pose.tongueX ?? null,
    jaw: pose.jawX ?? 0,
    rage: pose.rageX ?? 0,
    wink: pose.winkX ?? 0,
  };

  ctl.nextBlink -= dt;
  if (ctl.nextBlink <= 0) ctl.nextBlink = 1.6 + Math.random() * 3.4;
  const blinkTarget = Math.max(want.blink, ctl.nextBlink < .13 ? 1 : 0);
  ctl.blink += (blinkTarget - ctl.blink) * Math.min(1, dt * 18);
  ctl.winkR += (want.wink - ctl.winkR) * Math.min(1, dt * 10);

  if (want.tongue === null) {
    ctl.nextTongue -= dt;
    if (ctl.nextTongue <= 0) ctl.nextTongue = 6 + Math.random() * 9;
    ctl.tongue += ((ctl.nextTongue < 2.2 ? 1 : 0) - ctl.tongue) * Math.min(1, dt * 5);
  } else {
    ctl.tongue += (want.tongue - ctl.tongue) * Math.min(1, dt * 5);
  }

  ctl.jaw += (want.jaw - ctl.jaw) * Math.min(1, dt * 8);
  ctl.rage += (want.rage - ctl.rage) * Math.min(1, dt * 4);

  ctl.nextFlap -= dt;
  if (ctl.nextFlap <= 0) { ctl.nextFlap = 4 + Math.random() * 5; ctl.flapT = 0; }
  ctl.flapT += dt;
  const courtesy = ctl.flapT < .9 ? Math.sin(ctl.flapT / .9 * Math.PI * 3) * .5 * Math.sin(ctl.flapT / .9 * Math.PI) : 0;
  if (!currentPose.wingL) {
    P.wingL.rotation.z += courtesy;
    P.wingR.rotation.z -= courtesy;
  }

  eyeL.lid.rotation.x = -1.45 + ctl.blink * 1.5;
  eyeR.lid.rotation.x = -1.45 + Math.min(1, ctl.blink + ctl.winkR) * 1.5;

  const wander = stateName === "crazy" ? .45 : .16;
  eyeL.pupil.position.x = Math.sin(t * .7) * wander * eyeL.r;
  eyeL.pupil.position.y = Math.cos(t * .9) * wander * eyeL.r * .6;
  eyeR.pupil.position.x = Math.sin(t * 1.13 + 2) * wander * eyeR.r;
  eyeR.pupil.position.y = Math.cos(t * .77 + 1) * wander * eyeR.r * .6;

  P.browL.position.y = BASE.browL.p.y - ctl.rage * .1;
  P.browR.position.y = BASE.browR.p.y - ctl.rage * .1;
  P.browL.rotation.z = BASE.browL.r.z - ctl.rage * .45;
  P.browR.rotation.z = BASE.browR.r.z + ctl.rage * .45;
  eyeL.ball.material.emissive.setHex(0xff2810);
  eyeR.ball.material.emissive.setHex(0xff2810);
  eyeL.ball.material.emissiveIntensity = ctl.rage * .6;
  eyeR.ball.material.emissiveIntensity = ctl.rage * .5;

  P.jaw.rotation.x = BASE.jaw.r.x + ctl.jaw * .55;
  const out = ctl.tongue;
  P.tongue.visible = out > .04;
  P.tongue.scale.setScalar(Math.max(.01, out));
  P.tongue.rotation.x = .25 + (1 - out) * -.6 + osc(t, 1.7, .16 * out);
  tSegs[1].rotation.x = osc(t, 2.1, .35 * out, 1);
  tSegs[2].rotation.x = osc(t, 2.5, .5 * out, 2);
  tSegs[1].rotation.y = osc(t, 1.3, .2 * out);

  if (stateName === "sleeping") {
    ctl.snoreT -= dt;
    if (ctl.snoreT <= 0) {
      ctl.snoreT = 1.4;
      const hp = new THREE.Vector3(.3, .4, 1).applyMatrix4(P.head.matrixWorld);
      spawn("zzz", hp.x, hp.y, hp.z);
    }
  } else if ((stateName === "angry" || stateName === "rampage") && Math.random() < dt * 10) {
    const np = new THREE.Vector3((Math.random() < .5 ? -.22 : .22), .3, 1.4).applyMatrix4(P.head.matrixWorld);
    spawn("ember", np.x, np.y, np.z);
  }
  if ((stateName === "running" || stateName === "rampage") && Math.random() < dt * 7) {
    spawn("dust", (Math.random() - .5) * .7, .1, (Math.random() - .5) * .5);
  } else if (stateName === "eating" && Math.random() < dt * 3) {
    const mp = new THREE.Vector3(0, -.5, 1).applyMatrix4(P.head.matrixWorld);
    spawn("dust", mp.x, mp.y, mp.z);
  }
}

// ---------- UI ----------
const HUD = [
  ["standing", "🧍 Standing"], ["sleeping", "😴 Sleeping"], ["waking", "🥱 Waking"],
  ["running", "🏃 Running"], ["angry", "😡 Angry"], ["crazy", "🤪 Crazy"],
  ["rampage", "💥 Rampage"], ["eating", "😋 Eating"],
];
const hud = document.getElementById("hud");
for (const [s, label] of HUD) {
  const b = document.createElement("button");
  b.textContent = label;
  b.dataset.s = s;
  if (s === stateName) b.classList.add("on");
  b.onclick = () => setState(s);
  hud.appendChild(b);
}

// dev hook for scripted camera/screenshot checks
window.__lab = { camera, controls, setState };

// ---------- loop ----------
const clock = new THREE.Clock();
function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(.05, clock.getDelta());
  const t = clock.elapsedTime;
  stateT += dt;

  let pose = states[stateName](stateT);
  if (blend < 1 && prevPose) {
    blend = Math.min(1, blend + dt / .45);
    const k = blend * blend * (3 - 2 * blend);
    pose = mixPose(prevPose, pose, k);
  }
  currentPose = pose;
  applyPose(pose);
  microUpdate(dt, t, pose);
  updateParticles(dt);

  controls.update();
  renderer.render(scene, camera);
}
loop();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
