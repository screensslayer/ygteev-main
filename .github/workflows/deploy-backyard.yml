name: Deploy Backyard to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "games/backyard/**"
      - ".github/workflows/deploy-backyard.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: games/backyard/package-lock.json
      - name: Install
        run: npm ci
        working-directory: games/backyard
      - name: Build
        run: npm run build
        working-directory: games/backyard
      - uses: actions/upload-pages-artifact@v3
        with:
          path: games/backyard/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
