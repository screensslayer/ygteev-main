name: Lint

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-apply-clean:
    name: Migrations apply to fresh DB without errors
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Spin up local Supabase (DB + auth only, no studio)
        run: |
          supabase start \
            --exclude studio,inbucket,imgproxy,vector,edge-runtime,functions,realtime,pooler,storage-api,logflare

      - name: Apply all migrations to a fresh local DB
        # --no-seed skips supabase/seed.sql so the lint job validates ONLY that
        # the migration sequence builds cleanly from scratch. Seed contents are
        # staging-only and irrelevant to "do migrations work?".
        run: supabase db reset --no-seed

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  edge-functions-typecheck:
    name: Edge Functions type-check (advisory)
    runs-on: ubuntu-latest
    # Tech debt: many of the original edge functions were written before strict
    # type-checking and have implicit `any` / undefined-narrowing issues. They
    # deploy + run fine because Supabase doesn't strict-check on deploy. We
    # surface the errors in CI but don't block merges on them. As we modernize
    # each function, eventually flip continue-on-error back to false.
    continue-on-error: true
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Type-check all edge functions (advisory)
        run: |
          failed=0
          for fn in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$fn"))
            echo "::group::deno check $name"
            if ! deno check "$fn"; then
              echo "::warning file=$fn::deno check failed for $name (advisory)"
              failed=1
            fi
            echo "::endgroup::"
          done
          if [ $failed -eq 1 ]; then
            echo "::notice::Some edge functions have type errors. Treated as advisory for v1."
          fi
          exit $failed

# NOTES ON DEFERRED CI WORK (not blocking v1, revisit when needed):
#
# 1. types-in-sync check. Generating types from `--local` and `--linked` produces
#    structurally different output (extra `__InternalSupabase` block, different
#    schema inclusion defaults). A real types-drift check needs both sides
#    using the same flow. Easiest path: dev workflow uses `supabase db reset
#    --no-seed && supabase gen types typescript --local --schema public >
#    supabase/types.ts` after every schema change, and CI runs the same.
#
# 2. Edge function strict typecheck. Re-flip continue-on-error to false once
#    all existing functions are modernized (annotate function params, narrow
#    Deno.env.get() returns via `??` defaults or non-null assertions).
