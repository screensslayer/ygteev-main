name: Lint

on:
  push:
    branches: [main]
  pull_request:

# Don't run the same SHA twice
concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrations-and-types:
    name: Migrations build clean + types in sync
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Spin up local Supabase (DB + auth only, no studio)
        run: |
          supabase start \
            --exclude studio,inbucket,imgproxy,vector,edge-runtime,functions,realtime,pooler,storage-api,logflare

      - name: Apply all migrations to local DB
        # supabase start already applies migrations; this is belt-and-suspenders
        # in case a migration was added that depends on a fresh apply order.
        run: supabase db reset

      - name: Generate types from local DB
        run: supabase gen types typescript --local > /tmp/local_types.ts

      - name: Fail if supabase/types.ts is out of sync
        run: |
          if ! diff -q /tmp/local_types.ts supabase/types.ts > /dev/null; then
            echo "::error::supabase/types.ts is stale. Regenerate locally with:"
            echo "  supabase gen types typescript --linked > supabase/types.ts"
            echo ""
            echo "Diff:"
            diff /tmp/local_types.ts supabase/types.ts | head -200
            exit 1
          fi
          echo "✅ supabase/types.ts matches current schema"

      - name: Stop local Supabase
        if: always()
        run: supabase stop --no-backup || true

  edge-functions-typecheck:
    name: Edge Functions compile
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Install Deno
        uses: denoland/setup-deno@v1
        with:
          deno-version: v1.x

      - name: Type-check all edge functions
        # Each function is its own module under supabase/functions/<name>/index.ts.
        # `deno check` validates syntax + types without executing.
        run: |
          set -e
          failed=0
          for fn in supabase/functions/*/index.ts; do
            name=$(basename $(dirname "$fn"))
            echo "::group::deno check $name"
            if ! deno check "$fn"; then
              echo "::error file=$fn::deno check failed for $name"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit $failed
